name: checks

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync ruff check src tests migrations scripts examples
      - run: uv run --no-sync ruff format --check src tests migrations scripts examples
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest -q
      - run: uv pip check
      - run: uv build
